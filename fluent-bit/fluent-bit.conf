[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/nginx/access.json
    Tag               pensionsrechner.web
    Parser            nginx_json
    Refresh_Interval  5
    # Auch bereits vorhandene Zeilen ab Dateianfang lesen (z.B. Backlog zwischen
    # nginx- und Fluent-Bit-Start). Die Position-DB verhindert Doppelversand bei Neustart.
    Read_from_Head    On
    DB                /var/log/nginx/flb_pos.db

[FILTER]
    Name    record_modifier
    Match   pensionsrechner.web
    # Markierung wie bei lehrplan-at; Quelle unterscheidet Web- von etwaigen API-Zugriffen.
    Record  application  pensionsrechner
    Record  Environment  ${APP_ENV}
    Record  LogType      PensionsrechnerZugriff
    Record  Quelle       Website

[OUTPUT]
    Name               es
    Match              pensionsrechner.web
    Host               ${ELASTICSEARCH_HOST}
    Port               ${ELASTICSEARCH_PORT}
    # Eigener regulaerer Index "<index>-web" (wird automatisch angelegt, dynamisches
    # Mapping) - gleiche Konvention wie lehrplan-at. Das "-web"-Suffix haelt den Platz
    # fuer einen spaeteren Serilog-Data-Stream frei; beide waeren dann gemeinsam ueber
    # das Pattern "<index>*" abfragbar.
    Index              ${ELASTICSEARCH_INDEX}-web
    Suppress_Type_Name On
    Trace_Error        On

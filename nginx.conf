user  nginx;
worker_processes  auto;

# Fehler nach stderr -> via `docker logs` sichtbar.
error_log  /dev/stderr notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ohne diese Zeile sendet nginx "Content-Type: text/html" ohne charset. Browser lesen
    # dann zwar das <meta charset>, Link-Vorschau-Crawler (Reddit, Slack, WhatsApp ...)
    # aber nicht -- die fallen auf Latin-1 zurueck und zeigen "Ãsterreich" statt
    # "Österreich". charset_types deckt neben HTML auch CSS/JS/JSON ab.
    charset       utf-8;
    charset_types text/html text/css application/javascript application/json;

    # Echte Client-IP statt der Proxy-IP: Die Anfragen kommen ueber den Nginx Proxy
    # Manager (172.21.0.x im Netz nginx-proxy-net), $remote_addr waere daher immer
    # dessen Container-IP. Mit real_ip ersetzt nginx $remote_addr durch die IP aus
    # X-Forwarded-For -- aber NUR wenn die Anfrage aus einem der hier gelisteten
    # Netze kommt. Ohne diese Einschraenkung koennte jeder Client seine IP faelschen,
    # indem er den Header selbst setzt.
    set_real_ip_from  172.16.0.0/12;    # Docker-Netze (u.a. nginx-proxy-net 172.21.0.0/16)
    set_real_ip_from  10.0.0.0/8;       # privates LAN
    set_real_ip_from  192.168.0.0/16;   # privates LAN
    real_ip_header    X-Forwarded-For;
    # Kette von rechts nach links durchgehen und vertraute Adressen ueberspringen,
    # damit bei mehreren Proxies die erste untrusted (= echte Client-)IP gewinnt.
    real_ip_recursive on;

    # IP-Anonymisierung: letztes Oktett auf 0 (IPv6: nur die ersten zwei Bloecke). Damit
    # bleiben Zugriffszahlen und grobe Herkunft auswertbar, der Personenbezug entfaellt.
    map $remote_addr $remote_addr_anon {
        ~^(?<v4>\d+\.\d+\.\d+)\.\d+$   "$v4.0";
        ~^(?<v6>[0-9a-fA-F]+:[0-9a-fA-F]+):  "$v6::";
        default                              "0.0.0.0";
    }

    # Die Eingaben des Rechners stehen im Query-String (Geburtsdatum, Gehalt,
    # Kontostand ...). Der wird bewusst NICHT geloggt -- nur, ob ueberhaupt Parameter
    # da waren. Das unterscheidet geteilte Links von frischen Aufrufen, ohne
    # irgendetwas Personenbezogenes zu speichern.
    map $args $hat_parameter {
        ""      "0";
        default "1";
    }

    # JSON-Zugriffslog fuer Fluent Bit. Feldnamen mit nginx_-Praefix wie bei lehrplan-at,
    # damit es bei einer spaeteren Zusammenfuehrung mit ECS-Feldern (Serilog-Sinks der
    # anderen Projekte) keine Mapping-Konflikte gibt.
    # Bewusst NICHT im Log: der Query-String und die rohe X-Forwarded-For-Kette --
    # beide wuerden den Personenbezug wiederherstellen, den die Anonymisierung entfernt.
    log_format  json_pensionsrechner  escape=json
        '{'
            '"nginx_time":"$time_iso8601",'
            '"nginx_remote":"$remote_addr_anon",'
            '"nginx_method":"$request_method",'
            '"nginx_path":"$uri",'
            '"nginx_has_params":"$hat_parameter",'
            '"nginx_status":$status,'
            '"nginx_bytes":$body_bytes_sent,'
            '"nginx_referer":"$http_referer",'
            '"nginx_agent":"$http_user_agent",'
            '"nginx_request_time":$request_time'
        '}';

    # In eine echte Datei (geteiltes Volume) schreiben, damit Fluent Bit sie tailen kann.
    access_log  /var/log/nginx/access.json  json_pensionsrechner;

    sendfile        on;
    keepalive_timeout  65;

    # Cache-Politik nach Dateityp:
    #
    # HTML/JS/CSS bekommen "no-cache" -- das erlaubt Speichern, erzwingt aber bei
    # jedem Aufruf eine Revalidierung. Ohne das wenden Browser heuristisches Caching
    # an und holen die Rechenlogik gar nicht erst neu; bei einem Rechner heisst das
    # veraltete Zahlen, ohne dass es jemand merkt.
    #
    # Icons, robots.txt und Sitemap aendern sich dagegen praktisch nie. Fuer die war
    # "no-cache" messbar teuer: nach dem Reddit-Post entfielen rund 35 % aller
    # Requests auf Favicon-Revalidierungen (ueberwiegend 304, also Leerlauf -- ein
    # Browser prueft das Icon mehrmals pro Sitzung). Ein Tag Cache reicht hier.
    map $uri $cache_policy {
        ~*\.(ico|png|svg|jpg|jpeg|gif|webp|woff2?)$  "public, max-age=86400";
        ~*/(robots\.txt|sitemap\.xml)$               "public, max-age=86400";
        default                                       "no-cache";
    }
    add_header Cache-Control $cache_policy always;

    include /etc/nginx/conf.d/*.conf;
}
